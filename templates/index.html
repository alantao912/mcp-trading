<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Analysis Stream</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-1/3 lg:w-1/4 bg-white p-6 border-r border-gray-200 overflow-y-auto">
            <h2 class="text-2xl font-bold mb-6 text-gray-800">Analysis Progress</h2>
            <ul id="progress-tracker" class="space-y-6"></ul>

            <h2 class="text-2xl font-bold mt-8 mb-6 text-gray-800">Your Portfolio</h2>
            <div id="portfolio-container" class="space-y-4"></div>
        </aside>

        <!-- Main Content -->
        <main class="w-2/3 lg:w-3/4 p-6 md:p-8 overflow-y-auto">
            <header class="text-center mb-8">
                <h1 class="text-3xl md:text-4xl font-bold text-gray-900">Finly - Real-Time Stock Analysis</h1>
                <p class="text-md md:text-lg text-gray-600">Enter your query below and start the analysis to get a tailored report.</p>
            </header>

            <div class="mb-8">
                <label for="user-query" class="block mb-2 text-sm font-medium text-gray-900">Your Query:</label>
                <textarea id="user-query" rows="3" class="block p-2.5 w-full text-sm text-gray-900 bg-white rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500" placeholder="e.g., Which of these stocks are best for a long-term investment?"></textarea>
            </div>

            <div class="text-center mb-8">
                <button id="start-analysis" class="bg-blue-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-blue-700 transition duration-300 ease-in-out transform hover:scale-105">
                    Start Analysis
                </button>
            </div>

            <!-- Progress Bar and Status -->
            <div id="progress-container" class="w-full bg-gray-200 rounded-full h-2.5 mb-4 hidden">
                <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <div id="status-text" class="text-center text-gray-600 mb-8"></div>

            <!-- Final Report Container (shown immediately below controls) -->
            <div id="final-report-container" class="mb-8"></div>

            <!-- Stocks Container with compact layout -->
            <div id="stocks-container" class="flex gap-6">
                <!-- Main stocks accordion -->
                <div id="accordion-container" class="flex-1 bg-white rounded-lg shadow-md overflow-hidden"></div>
                
                <!-- Stock symbols sidebar (shown when analysis is complete) -->
                <div id="symbols-sidebar" class="w-64 bg-white rounded-lg shadow-md p-4 hidden">
                    <h3 class="font-semibold text-gray-800 mb-3">Analyzed Stocks</h3>
                    <div id="symbols-list" class="space-y-2"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const startButton = document.getElementById('start-analysis');
        const userQueryInput = document.getElementById('user-query');
        const accordionContainer = document.getElementById('accordion-container');
        const finalReportContainer = document.getElementById('final-report-container');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('status-text');
        const progressTracker = document.getElementById('progress-tracker');

        let totalStocks = 0;
        let processedStocks = 0;

        const trackerSteps = {
            start: { text: 'Analysis Initiated' },
            fetch_trending: { text: 'Fetching Trending Stocks' },
            fetch_data: { text: 'Fetching Stats & News' },
            generate_summary: { text: 'Generating Final Report' },
            complete: { text: 'Analysis Complete' }
        };

        function initializeTracker() {
            progressTracker.innerHTML = '';
            Object.entries(trackerSteps).forEach(([key, value]) => {
                const item = document.createElement('li');
                item.id = `tracker-${key}`;
                item.className = 'flex items-center text-gray-500';
                item.innerHTML = `
                    <div class="status-icon border-2 border-gray-400 rounded-full h-5 w-5 flex items-center justify-center mr-4 flex-shrink-0">
                        <div class="dot h-2 w-2 rounded-full"></div>
                    </div>
                    <span>${value.text}</span>
                `;
                progressTracker.appendChild(item);
            });
        }

        function updateTracker(stepId, status) {
            const item = document.getElementById(`tracker-${stepId}`);
            if (!item) return;

            const icon = item.querySelector('.status-icon');
            const dot = item.querySelector('.dot');
            item.classList.remove('text-gray-500', 'text-blue-600', 'text-green-600');
            icon.classList.remove('border-gray-400', 'border-blue-600', 'border-green-600', 'animate-spin');
            dot.classList.remove('bg-blue-600', 'bg-green-600');

            switch (status) {
                case 'in-progress':
                    item.classList.add('text-blue-600');
                    icon.classList.add('border-blue-600', 'animate-spin');
                    break;
                case 'completed':
                    item.classList.add('text-green-600', 'font-semibold');
                    icon.classList.add('border-green-600');
                    dot.classList.add('bg-green-600');
                    break;
            }
        }

        startButton.addEventListener('click', () => {
            accordionContainer.innerHTML = '';
            finalReportContainer.innerHTML = ''; // Clear previous report
            statusText.textContent = '';
            progressContainer.classList.add('hidden');
            progressBar.style.width = '0%';
            totalStocks = 0;
            processedStocks = 0;
            initializeTracker();

            const query = userQueryInput.value || 'Provide a general summary of the market and the trending stocks.';
            const eventSource = new EventSource(`http://localhost:8000/stream-analysis?query=${encodeURIComponent(query)}`);

            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);

                switch (data.event) {
                    case 'portfolio_holdings':
                        renderPortfolio(data.data);
                        break;

                    case 'start':
                        updateTracker('start', 'completed');
                        updateTracker('fetch_trending', 'in-progress');
                        statusText.textContent = data.message;
                        progressContainer.classList.remove('hidden');
                        break;

                    case 'trending_stocks':
                        updateTracker('fetch_trending', 'completed');
                        updateTracker('fetch_data', 'in-progress');
                        totalStocks = data.data.length;
                        statusText.textContent = `Found ${totalStocks} stocks. Fetching details...`;
                        progressBar.style.width = '20%';
                        data.data.forEach(stock => {
                            accordionContainer.appendChild(createAccordionItem(stock));
                        });
                        break;

                    case 'key_stat':
                        processedStocks++;
                        const keyStatsPercentage = 20 + (processedStocks / totalStocks) * 30; // 20-50%
                        progressBar.style.width = `${keyStatsPercentage}%`;
                        statusText.textContent = `Processing stats... (${processedStocks}/${totalStocks}) - ${data.ticker}`;
                        updateAccordionItem(data.ticker, data.data);

                        if (document.querySelectorAll('[id^="news-section-"]:not(.hidden)').length === totalStocks && document.querySelectorAll('[id^="stats-section-"]:not(.hidden)').length === totalStocks) {
                            updateTracker('fetch_data', 'completed');
                            updateTracker('generate_summary', 'in-progress');
                            progressBar.style.width = '80%';
                            statusText.textContent = 'Generating final analysis...';
                        }
                        break;
                    
                    case 'news':
                        appendNewsToAccordion(data.ticker, data.data);
                        const newsCount = document.querySelectorAll('#news-section-${data.ticker}:not(.hidden)').length;
                        const newsPercentage = 50 + (newsCount / totalStocks) * 30; // 50-80%
                        progressBar.style.width = `${newsPercentage}%`;
                        statusText.textContent = `Fetching news... (${newsCount}/${totalStocks})`;
                        
                        if (document.querySelectorAll('[id^="news-section-"]:not(.hidden)').length === totalStocks && document.querySelectorAll('[id^="stats-section-"]:not(.hidden)').length === totalStocks) {
                            updateTracker('fetch_data', 'completed');
                            updateTracker('generate_summary', 'in-progress');
                            progressBar.style.width = '80%';
                            statusText.textContent = 'Generating final analysis...';
                        }
                        break;

                    case 'final_summary':
                        updateTracker('generate_summary', 'completed');
                        progressBar.style.width = '95%';
                        statusText.textContent = 'Analysis complete! Displaying results...';
                        renderFinalReport(data.data);
                        showSymbolsSidebar();
                        break;

                    case 'end':
                        updateTracker('complete', 'completed');
                        statusText.textContent = data.message;
                        progressBar.style.width = '100%';
                        collapseStocksList();
                        eventSource.close();
                        break;
                }
            };

            eventSource.onerror = function(err) {
                console.error('EventSource failed:', err);
                statusText.textContent = 'Error connecting to the server.';
                eventSource.close();
            };
        });

        function createAccordionItem(stock) {
            const item = document.createElement('div');
            item.id = `stock-${stock.ticker}`;
            item.className = 'border-b border-gray-200 last:border-b-0';
            item.innerHTML = `
                <details class="group">
                    <summary class="p-3 cursor-pointer flex justify-between items-center w-full hover:bg-gray-50 transition-colors">
                        <div class="flex-1">
                            <div class="flex items-center gap-3">
                                <h2 class="text-base font-semibold text-gray-800">${stock.ticker}</h2>
                                <span class="text-xs text-gray-500 bg-gray-100 px-2 py-1 rounded">${stock.name}</span>
                            </div>
                            <p class="text-xs text-gray-500 mt-1">${stock.reason_for_trending}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="loader ease-linear rounded-full border-2 border-t-2 border-gray-300 h-4 w-4 hidden" id="loader-${stock.ticker}"></div>
                            <div class="text-xs text-gray-400 group-open:rotate-180 transition-transform">▼</div>
                        </div>
                    </summary>
                    <div class="bg-gray-50 border-t border-gray-200">
                        <!-- Stats section -->
                        <div id="stats-section-${stock.ticker}" class="hidden">
                            <details class="border-b border-gray-200">
                                <summary class="p-3 text-sm font-medium text-gray-700 cursor-pointer hover:bg-gray-100">📊 Key Statistics</summary>
                                <div class="p-3 bg-white" id="stats-content-${stock.ticker}"></div>
                            </details>
                        </div>
                        
                        <!-- News section -->
                        <div id="news-section-${stock.ticker}" class="hidden">
                            <details class="border-b border-gray-200">
                                <summary class="p-3 text-sm font-medium text-gray-700 cursor-pointer hover:bg-gray-100">📰 Recent News</summary>
                                <div class="p-3 bg-white" id="news-content-${stock.ticker}"></div>
                            </details>
                        </div>
                    </div>
                </details>
            `;
            return item;
        }

        function updateAccordionItem(ticker, stats) {
            const loader = document.getElementById(`loader-${ticker}`);
            const statsSection = document.getElementById(`stats-section-${ticker}`);
            const statsContent = document.getElementById(`stats-content-${ticker}`);
            
            if (loader) {
                loader.classList.add('hidden');
            }
            
            if (statsSection && statsContent) {
                statsSection.classList.remove('hidden');
                
                let statsHtml = '<div class="grid grid-cols-2 gap-3">';
                for (const [key, value] of Object.entries(stats)) {
                    if (value !== null && value !== undefined) {
                        statsHtml += `
                            <div class="text-center p-2 bg-gray-50 rounded">
                                <div class="text-xs text-gray-500 capitalize">${key.replace(/_/g, ' ')}</div>
                                <div class="text-sm font-medium text-gray-900">${value}</div>
                            </div>
                        `;
                    }
                }
                statsHtml += '</div>';
                statsContent.innerHTML = statsHtml;
            }
        }

        function appendNewsToAccordion(ticker, news) {
            const newsSection = document.getElementById(`news-section-${ticker}`);
            const newsContent = document.getElementById(`news-content-${ticker}`);
            
            if (newsSection && newsContent) {
                newsSection.classList.remove('hidden');
                
                let newsHtml = '<div class="space-y-3">';
                if (news && news.length > 0) {
                    news.forEach(newsItem => {
                        newsHtml += `
                            <div class="p-3 bg-gray-50 rounded border-l-4 border-blue-500">
                                <a href="${newsItem.link}" target="_blank" class="text-sm font-medium text-blue-600 hover:underline">${newsItem.title}</a>
                                <p class="text-xs text-gray-600 mt-1">${newsItem.summary}</p>
                            </div>
                        `;
                    });
                } else {
                    newsHtml += '<p class="text-sm text-gray-500">No recent news found.</p>';
                }
                newsHtml += '</div>';
                newsContent.innerHTML = newsHtml;
            }
        }

        function showSymbolsSidebar() {
            const sidebar = document.getElementById('symbols-sidebar');
            const symbolsList = document.getElementById('symbols-list');
            const stocks = document.querySelectorAll('[id^="stock-"]');
            
            sidebar.classList.remove('hidden');
            
            let symbolsHtml = '';
            stocks.forEach(stock => {
                const ticker = stock.id.replace('stock-', '');
                const name = stock.querySelector('span').textContent;
                symbolsHtml += `
                    <div class="p-2 bg-gray-50 rounded text-center cursor-pointer hover:bg-gray-100" onclick="document.getElementById('stock-${ticker}').scrollIntoView()">
                        <div class="font-semibold text-sm">${ticker}</div>
                        <div class="text-xs text-gray-500">${name}</div>
                    </div>
                `;
            });
            symbolsList.innerHTML = symbolsHtml;
        }

        function collapseStocksList() {
            const accordionContainer = document.getElementById('accordion-container');
            accordionContainer.classList.add('max-h-96', 'overflow-y-auto');
            
            // Close all details elements
            const details = accordionContainer.querySelectorAll('details');
            details.forEach(detail => {
                detail.open = false;
            });
        }

        function renderFinalReport(report) {
            // Helper function to render markdown content with Tailwind styling
            function renderMarkdown(content) {
                const html = marked.parse(content || '');
                return html
                    .replace(/<h1>/g, '<h1 class="text-2xl font-bold mb-4 text-gray-900">')
                    .replace(/<h2>/g, '<h2 class="text-xl font-semibold mb-3 text-gray-800">')
                    .replace(/<h3>/g, '<h3 class="text-lg font-medium mb-2 text-gray-700">')
                    .replace(/<p>/g, '<p class="mb-3 text-gray-700 leading-relaxed">')
                    .replace(/<ul>/g, '<ul class="list-disc list-inside mb-3 space-y-1">')
                    .replace(/<ol>/g, '<ol class="list-decimal list-inside mb-3 space-y-1">')
                    .replace(/<li>/g, '<li class="text-gray-700">')
                    .replace(/<strong>/g, '<strong class="font-semibold text-gray-900">')
                    .replace(/<em>/g, '<em class="italic text-gray-600">')
                    .replace(/<blockquote>/g, '<blockquote class="border-l-4 border-blue-500 pl-4 italic text-gray-600 mb-3">');
            }
            
            const reportHtml = `
                <div class="bg-white rounded-lg shadow-md p-6">
                    <h2 class="text-2xl font-bold mb-6 text-gray-900">📊 Financial Analysis Report</h2>
                    
                    <div class="mb-6 p-4 bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700">
                        <p class="font-bold mb-2">⚠️ Disclaimer</p>
                        <div class="text-sm">${renderMarkdown(report.disclaimer)}</div>
                    </div>

                    <div class="mb-8">
                        <h3 class="text-xl font-semibold mb-4 text-gray-800 border-b border-gray-200 pb-2">🌍 Market Overview</h3>
                        <div class="prose max-w-none">${renderMarkdown(report.market_overview)}</div>
                    </div>

                    <div class="mb-8">
                        <h3 class="text-xl font-semibold mb-4 text-gray-800 border-b border-gray-200 pb-2">📈 Detailed Stock Analysis</h3>
                        <div class="space-y-6">
                            ${report.detailed_analysis.map(stock => `
                                <div class="p-6 border border-gray-200 rounded-lg bg-gray-50">
                                    <h4 class="font-bold text-xl mb-4 text-blue-600">${stock.ticker}</h4>
                                    <div class="prose max-w-none mb-4">${renderMarkdown(stock.analysis)}</div>
                                    <div class="mt-4 p-3 bg-white rounded border-l-4 border-blue-500">
                                        <p class="font-semibold text-gray-700">💡 Recommendation:</p>
                                        <div class="text-blue-600 font-medium">${renderMarkdown(stock.recommendation)}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="border-t border-gray-200 pt-6">
                        <h3 class="text-xl font-semibold mb-4 text-gray-800">🎯 Executive Summary</h3>
                        <div class="prose max-w-none bg-blue-50 p-4 rounded-lg">${renderMarkdown(report.final_summary)}</div>
                    </div>
                </div>
            `;
            finalReportContainer.innerHTML = reportHtml;
        }

        function renderPortfolio(portfolio) {
            const container = document.getElementById('portfolio-container');
            if (!container) return;

            let html = '<div class="space-y-3">';
            if (portfolio && portfolio.investments && portfolio.investments.length > 0) {
                portfolio.investments.forEach(investment => {
                    // Add accordion item for portfolio stocks if not already present
                    if (!document.getElementById(`stock-${investment.name}`)) {
                        const portfolioStock = {
                            ticker: investment.name,
                            name: investment.name, // Use ticker as name if not available
                            reason_for_trending: 'In your portfolio'
                        };
                        accordionContainer.appendChild(createAccordionItem(portfolioStock));
                    }

                    html += `
                        <div class="p-3 bg-gray-50 rounded-lg border border-gray-200">
                            <div class="flex justify-between items-center">
                                <span class="font-semibold text-gray-800">${investment.name}</span>
                                <span class="text-sm text-gray-600">${investment.qty} shares</span>
                            </div>
                            <div class="text-xs text-gray-500 mt-1">Avg. Cost: $${investment.cost.toFixed(2)}</div>
                        </div>
                    `;
                });
            } else {
                html += '<p class="text-sm text-gray-500">No holdings to display.</p>';
            }
            html += '</div>';

            html += `
                <div class="mt-4 p-3 bg-green-50 rounded-lg border border-green-200 text-center">
                    <div class="text-sm text-green-700">Cash Balance</div>
                    <div class="text-lg font-bold text-green-800">$${(115400 || 0).toFixed(2)}</div>
                </div>
            `;

            container.innerHTML = html;
        }

        // Initialize on page load
        initializeTracker();
    </script>
</body>
</html>
